name: deploy-crabbox-coordinator

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-crabbox-coordinator
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Crabbox Coordinator
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Crabbox
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: openclaw/crabbox
          ref: main

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci --prefix worker

      - name: Verify deploy credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CRABBOX_OPENCLAW_TOKEN: ${{ secrets.CRABBOX_OPENCLAW_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN before deploying Crabbox."
            exit 1
          fi
          if [ -z "${CRABBOX_OPENCLAW_TOKEN:-}" ]; then
            echo "::error::Set CRABBOX_OPENCLAW_TOKEN before deploying Crabbox."
            exit 1
          fi

      - name: Check
        run: |
          npm run format:check --prefix worker
          npm run lint --prefix worker
          npm run check --prefix worker
          npm test --prefix worker
          npm run build --prefix worker

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CRABBOX_OPENCLAW_TOKEN: ${{ secrets.CRABBOX_OPENCLAW_TOKEN }}
        working-directory: worker
        run: |
          set -euo pipefail
          token="$(
            node -e '
              const { createHmac } = require("node:crypto");
              const root = process.env.CRABBOX_OPENCLAW_TOKEN?.trim();
              if (!root) process.exit(1);
              process.stdout.write(
                createHmac("sha256", root)
                  .update("openclaw/crabbox-runtime-adapter/v1")
                  .digest("base64url"),
              );
            '
          )"
          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file"' EXIT
          SECRETS_FILE="$secrets_file" \
            CRABBOX_RUNTIME_ADAPTER_TOKEN="$token" \
            node -e '
              const { writeFileSync } = require("node:fs");
              writeFileSync(
                process.env.SECRETS_FILE,
                JSON.stringify({
                  CRABBOX_RUNTIME_ADAPTER_TOKEN:
                    process.env.CRABBOX_RUNTIME_ADAPTER_TOKEN,
                }),
              );
            '
          deployed=0
          for attempt in 1 2 3; do
            if npx wrangler deploy --config wrangler.jsonc --secrets-file "$secrets_file"; then
              deployed=1
              break
            fi
            sleep $((attempt * 5))
          done
          test "$deployed" = "1"
          verified=0
          for attempt in $(seq 1 30); do
            workspace_status="$(
              curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
                --header "Authorization: Bearer $token" \
                https://crabbox.openclaw.ai/v1/workspaces/deploy-auth-check
            )"
            lease_status="$(
              curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
                --header "Authorization: Bearer $token" \
                https://crabbox.openclaw.ai/v1/leases
            )"
            if [ "$workspace_status" = "404" ] && [ "$lease_status" = "401" ]; then
              verified=$((verified + 1))
              if [ "$verified" = "12" ]; then
                break
              fi
            else
              verified=0
            fi
            sleep 2
          done
          test "$verified" = "12"

      - name: Verify deployment
        run: |
          response="$(
            curl --fail --silent --show-error \
              --retry 12 --retry-all-errors --retry-delay 5 --max-time 20 \
              https://crabbox.openclaw.ai/v1/health
          )"
          node -e '
            const value = JSON.parse(process.argv[1]);
            if (value.ok !== true || value.service !== "crabbox-coordinator") process.exit(1);
          ' "$response"
