name: cli

on:
  push:
    branches:
      - main
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile.ssh-gateway"
      - ".github/workflows/cli.yml"
  pull_request:
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile.ssh-gateway"
      - ".github/workflows/cli.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go CLI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build crabfleet
        run: go build -trimpath -o /tmp/crabfleet ./cmd/crabfleet

      - name: Build SSH gateway
        run: go build -trimpath -o /tmp/crabbox-ssh-gateway ./cmd/crabbox-ssh-gateway

      - name: Smoke CLI help
        run: |
          /tmp/crabfleet --version
          /tmp/crabfleet --help
          /tmp/crabfleet new --help
          /tmp/crabfleet login --help

      - name: Build SSH gateway image
        run: docker build -f Dockerfile.ssh-gateway .
