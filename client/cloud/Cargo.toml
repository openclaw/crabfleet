[package]
name = "crabfleet-cloud"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
crabfleet-fluid = { path = "../fluid" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
zeroize = "1.9.0"
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "=0.4.78"
js-sys = "=0.3.105"
web-sys = { version = "=0.3.105", features = [
  "Window",
  "Location",
  "Request",
  "RequestInit",
  "RequestMode",
  "RequestCredentials",
  "RequestRedirect",
  "RequestCache",
  "ReferrerPolicy",
  "Headers",
  "Response",
  "AbortController",
  "AbortSignal",
  "ReadableStream",
  "ReadableStreamDefaultReader",
  "WebSocket",
  "BinaryType",
  "MessageEvent",
  "CloseEvent",
  "Event",
] }
