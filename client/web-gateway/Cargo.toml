[package]
name = "crabfleet-web-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
crabfleet-cloud = { path = "../cloud" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
tokio = { version = "1.53.1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "sync",
  "signal",
  "time",
  "fs",
] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = [
  "connect",
  "rustls-tls-native-roots",
] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
futures-util = "0.3.34"
serde_json = "1.0.149"
zeroize = "1.9.0"
url = "2.5.8"

[dev-dependencies]
crabfleet-fluid = { path = "../fluid" }
