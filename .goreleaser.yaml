version: 2

project_name: crabfleet

changelog:
  disable: true

builds:
  - id: crabfleet
    main: ./cmd/crabfleet
    binary: crabfleet
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: crabfleet-connect
    main: ./cmd/crabfleet-connect
    binary: crabfleet-connect
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - linux_amd64
      - linux_arm64

archives:
  - id: crabfleet
    ids:
      - crabfleet
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
  - id: crabfleet-connect
    ids:
      - crabfleet-connect
    formats:
      - tar.gz
    name_template: "crabfleet-connect_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE*
      - src: docs/linux-connector.md
        dst: README.md

checksum:
  name_template: checksums.txt
